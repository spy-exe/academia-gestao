spring:
  web:
    locale: pt_BR
    locale-resolver: fixed
  application:
    name: academia-gestao
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/academia}
    username: ${DB_USER:academia}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      enabled: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:true}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  structured:
    format:
      console: logstash
