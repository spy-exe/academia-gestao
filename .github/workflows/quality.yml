name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B verify
        working-directory: backend
      - name: Scan resolved runtime dependencies
        working-directory: backend
        run: |
          ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DincludeTestScope=false
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64 -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan source --sbom=target/bom.json --format=json --output-file=target/osv.json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-verified
          path: |
            backend/target/academia-gestao-1.0.0.jar
            backend/target/site/jacoco
            backend/target/bom.json
            backend/target/osv.json
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run format:check && npm test && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-verified
          path: |
            frontend/dist
            frontend/coverage
  e2e:
    needs: [backend, frontend, operations, secrets, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: academia
          POSTGRES_PASSWORD: ci-database-only
          POSTGRES_DB: academia_ci_demo
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/academia_ci_demo
      DB_USER: academia
      DB_PASSWORD: ci-database-only
      COOKIE_SECURE: 'false'
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_EMAIL: admin@example.test
      E2E_RUNTIME: process
      E2E_AUTH_STATE: /tmp/academia-auth.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: backend-verified
          path: backend/target
      - uses: actions/download-artifact@v4
        with:
          name: frontend-verified
          path: frontend
      - name: Prepare isolated administrator
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          ADMIN_EMAIL="$E2E_EMAIL" ADMIN_PASSWORD="$password" java -jar backend/target/academia-gestao-1.0.0.jar --spring.profiles.active=bootstrap --server.port=0
      - name: Start real services
        run: |
          java -jar backend/target/academia-gestao-1.0.0.jar > /tmp/backend.log 2>&1 &
          echo $! > /tmp/academia-backend.pid
          cd frontend
          npm ci
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/frontend.log 2>&1 &
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Wait for application
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health && curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Seed isolated acceptance database
        run: APP_ENV=demo PGHOST=127.0.0.1 PGUSER="$DB_USER" PGPASSWORD="$DB_PASSWORD" PGDATABASE=academia_ci_demo infrastructure/seed-demo.sh
      - run: npm run test:e2e
        working-directory: frontend
      - run: node scripts/audit-accessibility.mjs
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
            docs/evidence/accessibility.json
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash -n infrastructure/*.sh infrastructure/lib/*.sh
      - run: python3 -m unittest discover -s infrastructure/tests -v
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan complete history
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --log-opts=--all --redact
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm audit --audit-level=high
        working-directory: frontend
